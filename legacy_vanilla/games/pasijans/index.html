<!DOCTYPE html>
<html class="dark" lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klondike Pasijans - EduArcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        :root {
            --card-w: 90px;
            --card-h: 130px;
            --card-overlap: 30px;
        }

        @media (max-width: 768px) {
            :root {
                --card-w: calc((100vw - 28px) / 7);
                --card-h: calc(var(--card-w) * 1.5);
                --card-overlap: calc(var(--card-h) * 0.22);
            }
            .card {
                padding: 4px 2px;
                border-width: 1px;
                border-radius: 6px;
            }
            .card.card-back {
                border-width: 2px;
            }
            .pile-slot {
                border-radius: 6px;
            }
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #dce1fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card {
            width: var(--card-w);
            height: var(--card-h);
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35);
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px 8px;
            font-weight: 800;
            color: #0f172a;
            border: 2px solid #cbd5e1;
            box-sizing: border-box;
            touch-action: none;
        }

        .card.red { color: #dc2626; }
        .card.black { color: #0f172a; }

        .card-back {
            background-color: #020617;
            border: 2px solid #22c55e;
            box-shadow: inset 0 0 15px rgba(34, 197, 94, 0.2);
            background-image: 
                repeating-linear-gradient(45deg, rgba(34, 197, 94, 0.08) 0, rgba(34, 197, 94, 0.08) 4px, transparent 4px, transparent 10px),
                repeating-linear-gradient(-45deg, rgba(34, 197, 94, 0.08) 0, rgba(34, 197, 94, 0.08) 4px, transparent 4px, transparent 10px);
            cursor: default;
        }

        .pile-slot {
            width: var(--card-w);
            height: var(--card-h);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .dragging-group {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-1 sm:p-3 md:p-6 selection:bg-green-500/30">

    <!-- Dinamička pozadina -->
    <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
        <div class="absolute top-1/4 -left-20 w-96 h-96 bg-green-500/10 blur-[140px] rounded-full"></div>
        <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-cyan-500/10 blur-[140px] rounded-full"></div>
    </div>

    <!-- Zaglavlje -->
    <header class="max-w-6xl mx-auto w-full glass-card rounded-2xl p-3 md:p-4 mb-4 flex justify-between items-center border border-white/10 shadow-xl">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🎴</span>
            <div>
                <h1 class="text-lg md:text-2xl font-black text-green-400 leading-tight">Klondike Pasijans</h1>
                <p class="text-[10px] md:text-xs text-slate-400 font-mono">Povuci kartu ili dvoklikni za temelj</p>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-4">
            <button onclick="window.location.href='../../index.html'" class="px-3 py-2 rounded-xl border border-white/15 text-xs font-bold text-slate-200 hover:bg-white/10 transition-all flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">home</span> <span class="hidden sm:inline">Hub</span>
            </button>
            <button onclick="startNewGame()" class="px-4 py-2 bg-green-500 hover:bg-green-400 text-slate-950 font-black text-xs rounded-xl transition-all shadow-lg active:scale-95">
                Nova igra
            </button>
        </div>
    </header>

    <!-- Glavna površina stola -->
    <main class="max-w-6xl mx-auto w-full flex-1 flex flex-col gap-4 md:gap-6">
        
        <!-- Gornji red (Špil, Otpad i 4 Temelja) -->
        <div class="flex justify-between items-center glass-card p-2 sm:p-3 md:p-5 rounded-2xl shadow-lg">
            <!-- Špil i Otpad -->
            <div class="flex gap-2 md:gap-4">
                <div id="stock-pile" onclick="drawStockCard()" class="pile-slot cursor-pointer flex items-center justify-center text-xl md:text-2xl text-slate-500 hover:border-green-400/40 transition-colors">
                    🔄
                </div>
                <div id="waste-pile" class="pile-slot relative"></div>
            </div>

            <!-- Temelji (A-K po znakovima) -->
            <div class="flex gap-1.5 md:gap-4">
                <div class="pile-slot foundation" data-suit="♥"></div>
                <div class="pile-slot foundation" data-suit="♦"></div>
                <div class="pile-slot foundation" data-suit="♠"></div>
                <div class="pile-slot foundation" data-suit="♣"></div>
            </div>
        </div>

        <!-- Donji red (7 Stupaca za igru) -->
        <div class="flex justify-between gap-[2px] sm:gap-1 md:gap-3 flex-1 glass-card p-1 sm:p-3 md:p-5 rounded-2xl min-h-[500px] overflow-hidden" id="tableau-container">
            <div class="pile-slot tableau relative" data-column="0"></div>
            <div class="pile-slot tableau relative" data-column="1"></div>
            <div class="pile-slot tableau relative" data-column="2"></div>
            <div class="pile-slot tableau relative" data-column="3"></div>
            <div class="pile-slot tableau relative" data-column="4"></div>
            <div class="pile-slot tableau relative" data-column="5"></div>
            <div class="pile-slot tableau relative" data-column="6"></div>
        </div>
    </main>

    <!-- Plutajući kontejner za vučene karte -->
    <div id="drag-ghost" class="dragging-group hidden"></div>

    <!-- Pobjednički modal -->
    <div id="win-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="glass-card p-8 rounded-3xl max-w-sm w-full text-center border border-green-500/40 shadow-2xl">
            <div class="text-6xl mb-3">🏆</div>
            <h2 class="text-2xl font-black text-green-400 mb-2">Čestitamo!</h2>
            <p class="text-sm text-slate-300 mb-6">Uspješno si riješio cijeli pasijans!</p>
            <button onclick="startNewGame()" class="w-full py-3 bg-green-500 text-slate-950 font-black rounded-xl hover:bg-green-400 transition-all shadow-lg active:scale-95">Igraj ponovno</button>
        </div>
    </div>

    <script>
        const SUITS = [
            { symbol: '♥', color: 'red' },
            { symbol: '♦', color: 'red' },
            { symbol: '♠', color: 'black' },
            { symbol: '♣', color: 'black' }
        ];
        const RANKS = [
            { name: 'A', val: 1 }, { name: '2', val: 2 }, { name: '3', val: 3 },
            { name: '4', val: 4 }, { name: '5', val: 5 }, { name: '6', val: 6 },
            { name: '7', val: 7 }, { name: '8', val: 8 }, { name: '9', val: 9 },
            { name: '10', val: 10 }, { name: 'J', val: 11 }, { name: 'Q', val: 12 }, { name: 'K', val: 13 }
        ];

        let deck = [];
        let stock = [];
        let waste = [];
        let foundations = { '♥': [], '♦': [], '♠': [], '♣': [] };
        let tableau = [[], [], [], [], [], [], []];

        // Drag & Drop State
        let dragState = null;

        function initDeck() {
            deck = [];
            let id = 0;
            SUITS.forEach(suit => {
                RANKS.forEach(rank => {
                    deck.push({ id: id++, suit: suit.symbol, color: suit.color, name: rank.name, val: rank.val, faceUp: false });
                });
            });
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function startNewGame() {
            initDeck();
            stock = [];
            waste = [];
            foundations = { '♥': [], '♦': [], '♠': [], '♣': [] };
            tableau = [[], [], [], [], [], [], []];
            dragState = null;
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('win-modal').classList.remove('flex');

            for (let col = 0; col < 7; col++) {
                for (let row = col; row < 7; row++) {
                    let card = deck.pop();
                    if (row === col) card.faceUp = true;
                    tableau[row].push(card);
                }
            }
            stock = deck;
            render();
        }

        function drawStockCard() {
            if (dragState) return;
            if (stock.length === 0) {
                stock = waste.reverse();
                waste = [];
                stock.forEach(c => c.faceUp = false);
            } else {
                let card = stock.pop();
                card.faceUp = true;
                waste.push(card);
            }
            render();
        }

        function autoMoveToFoundation(card, fromSource) {
            let fPile = foundations[card.suit];
            let topCard = fPile.length > 0 ? fPile[fPile.length - 1] : null;

            let canMove = false;
            if (!topCard && card.name === 'A') canMove = true;
            else if (topCard && card.val === topCard.val + 1) canMove = true;

            if (canMove) {
                if (fromSource.type === 'waste') {
                    foundations[card.suit].push(waste.pop());
                } else if (fromSource.type === 'tableau') {
                    foundations[card.suit].push(tableau[fromSource.col].pop());
                    let col = tableau[fromSource.col];
                    if (col.length > 0) col[col.length - 1].faceUp = true;
                }
                render();
                checkWin();
                return true;
            }
            return false;
        }

        function renderCardInner(card) {
            if (!card.faceUp) return `<div class="card card-back absolute"></div>`;
            return `
                <div class="flex justify-between items-start leading-none text-[10px] sm:text-xs md:text-sm">
                    <span>${card.name}</span>
                    <span>${card.suit}</span>
                </div>
                <div class="text-center text-lg sm:text-xl md:text-3xl my-auto select-none">${card.suit}</div>
                <div class="flex justify-between items-end leading-none text-[10px] sm:text-xs md:text-sm rotate-180">
                    <span>${card.name}</span>
                    <span>${card.suit}</span>
                </div>
            `;
        }

        function getOverlap() {
            return window.innerWidth <= 768 ? 26 : 38; // Veći razmak za otvorene karte
        }

        function render() {
            // 1. Stock
            const stockEl = document.getElementById('stock-pile');
            stockEl.innerHTML = stock.length > 0 ? `<div class="card card-back absolute" style="top:0; left:0;"></div>` : `<span class="text-xl md:text-2xl opacity-40">🔄</span>`;

            // 2. Waste
            const wasteEl = document.getElementById('waste-pile');
            wasteEl.innerHTML = '';
            if (waste.length > 0) {
                const numToShow = Math.min(3, waste.length);
                const horizontalOverlap = window.innerWidth <= 768 ? 12 : 20; // Vraćeno širenje karata
                for (let i = numToShow; i > 0; i--) {
                    const cardIndex = waste.length - i;
                    const card = waste[cardIndex];
                    const isTop = (i === 1);
                    
                    const cardEl = document.createElement('div');
                    cardEl.className = `card ${card.color} ${isTop ? 'cursor-grab active:cursor-grabbing' : ''}`;
                    cardEl.style.top = '0px'; 
                    cardEl.style.left = `${(numToShow - i) * horizontalOverlap}px`;
                    cardEl.innerHTML = renderCardInner(card);
                    
                    if (isTop) {
                        attachDragEvents(cardEl, { type: 'waste', card: card });
                        cardEl.ondblclick = () => autoMoveToFoundation(card, { type: 'waste' });
                    }
                    wasteEl.appendChild(cardEl);
                }
            }

            // 3. Foundations
            document.querySelectorAll('.foundation').forEach(slot => {
                const suit = slot.dataset.suit;
                slot.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-slate-600 text-2xl font-bold opacity-30 select-none">${suit}</div>`;
                const pile = foundations[suit];
                if (pile.length > 0) {
                    const topCard = pile[pile.length - 1];
                    const cardEl = document.createElement('div');
                    cardEl.className = `card ${topCard.color}`;
                    cardEl.style.top = '0px'; cardEl.style.left = '0px';
                    cardEl.innerHTML = renderCardInner(topCard);
                    slot.appendChild(cardEl);
                }
            });

            // 4. Tableau
            const overlap = getOverlap();
            const faceDownOverlap = window.innerWidth <= 768 ? 14 : 20; // Povećan razmak neotvorenih za efekt trokuta
            
            document.querySelectorAll('.tableau').forEach((slot, colIdx) => {
                slot.innerHTML = '';
                const colCards = tableau[colIdx];
                let currentTop = 0;
                
                colCards.forEach((card, cardIdx) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = `card ${card.faceUp ? card.color : 'card-back'}`;
                    cardEl.style.top = `${currentTop}px`;
                    cardEl.style.left = '0px';
                    cardEl.innerHTML = renderCardInner(card);

                    if (card.faceUp) {
                        cardEl.classList.add('cursor-grab', 'active:cursor-grabbing');
                        attachDragEvents(cardEl, { type: 'tableau', col: colIdx, idx: cardIdx, card });
                        if (cardIdx === colCards.length - 1) {
                            cardEl.ondblclick = () => autoMoveToFoundation(card, { type: 'tableau', col: colIdx });
                        }
                        currentTop += overlap;
                    } else {
                        if (cardIdx === colCards.length - 1) {
                            cardEl.onclick = () => { card.faceUp = true; render(); };
                        }
                        currentTop += faceDownOverlap;
                    }
                    slot.appendChild(cardEl);
                });
            });
        }

        // DRAG AND DROP HANDLERS (POINTER EVENTS ZA MIŠ I TOUCH)
        function attachDragEvents(el, sourceInfo) {
            el.onpointerdown = (e) => {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                e.preventDefault();
                startDrag(e, sourceInfo, el);
            };
        }

        function startDrag(e, source, originalEl) {
            let movingCards = [];
            if (source.type === 'waste') {
                movingCards = [waste[waste.length - 1]];
            } else if (source.type === 'tableau') {
                movingCards = tableau[source.col].slice(source.idx);
            }

            const rect = originalEl.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const offsetY = e.clientY - rect.top;

            const ghost = document.getElementById('drag-ghost');
            ghost.innerHTML = '';
            ghost.classList.remove('hidden');

            const overlap = getOverlap();
            movingCards.forEach((c, idx) => {
                const cEl = document.createElement('div');
                cEl.className = `card ${c.color}`;
                cEl.style.top = `${idx * overlap}px`;
                cEl.style.left = '0px';
                cEl.innerHTML = renderCardInner(c);
                ghost.appendChild(cEl);
            });

            dragState = {
                source,
                cards: movingCards,
                offsetX,
                offsetY
            };

            moveGhost(e.clientX, e.clientY);

            window.onpointermove = (ev) => {
                if (!dragState) return;
                moveGhost(ev.clientX, ev.clientY);
            };

            window.onpointerup = (ev) => {
                if (!dragState) return;
                endDrag(ev);
            };
        }

        function moveGhost(clientX, clientY) {
            const ghost = document.getElementById('drag-ghost');
            ghost.style.left = `${clientX - dragState.offsetX}px`;
            ghost.style.top = `${clientY - dragState.offsetY}px`;
        }

        function endDrag(e) {
            const ghost = document.getElementById('drag-ghost');
            ghost.classList.add('hidden');
            ghost.innerHTML = '';

            window.onpointermove = null;
            window.onpointerup = null;

            // Sakrij ghost privremeno kako bi elementFromPoint vidio slot ispod
            const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
            if (dropTarget) {
                const tableauSlot = dropTarget.closest('.tableau');
                const foundationSlot = dropTarget.closest('.foundation');

                if (tableauSlot) {
                    const targetCol = parseInt(tableauSlot.dataset.column);
                    tryDropOnTableau(targetCol);
                } else if (foundationSlot && dragState.cards.length === 1) {
                    const targetSuit = foundationSlot.dataset.suit;
                    tryDropOnFoundation(targetSuit);
                }
            }

            dragState = null;
            render();
            checkWin();
        }

        function tryDropOnTableau(targetCol) {
            const movingLead = dragState.cards[0];
            const col = tableau[targetCol];
            const targetCard = col.length > 0 ? col[col.length - 1] : null;

            let valid = false;
            if (!targetCard) {
                valid = true;
            } else if (targetCard.faceUp && targetCard.color !== movingLead.color && targetCard.val === movingLead.val + 1) {
                valid = true;
            }

            if (valid) {
                if (dragState.source.type === 'waste') {
                    waste.pop();
                } else if (dragState.source.type === 'tableau') {
                    tableau[dragState.source.col].splice(dragState.source.idx);
                    const sourceCol = tableau[dragState.source.col];
                    if (sourceCol.length > 0) sourceCol[sourceCol.length - 1].faceUp = true;
                }
                tableau[targetCol].push(...dragState.cards);
            }
        }

        function tryDropOnFoundation(targetSuit) {
            const card = dragState.cards[0];
            if (card.suit !== targetSuit) return;

            const fPile = foundations[targetSuit];
            const topCard = fPile.length > 0 ? fPile[fPile.length - 1] : null;

            let valid = false;
            if (!topCard && card.name === 'A') valid = true;
            else if (topCard && card.val === topCard.val + 1) valid = true;

            if (valid) {
                if (dragState.source.type === 'waste') {
                    foundations[targetSuit].push(waste.pop());
                } else if (dragState.source.type === 'tableau') {
                    foundations[targetSuit].push(tableau[dragState.source.col].pop());
                    const sourceCol = tableau[dragState.source.col];
                    if (sourceCol.length > 0) sourceCol[sourceCol.length - 1].faceUp = true;
                }
            }
        }

        function checkWin() {
            const totalFoundations = Object.values(foundations).reduce((acc, pile) => acc + pile.length, 0);
            if (totalFoundations === 52) {
                const winModal = document.getElementById('win-modal');
                winModal.classList.remove('hidden');
                winModal.classList.add('flex');
            }
        }

        window.onload = () => {
            startNewGame();
        };

        window.onresize = () => {
            render();
        };
    </script>
</body>
</html>
