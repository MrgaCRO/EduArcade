<!DOCTYPE html>
<html class="dark" lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pac-Man Edu - EduArcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col p-2 md:p-6 selection:bg-yellow-500/30">

    <!-- Dinamička pozadina -->
    <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
        <div class="absolute top-1/4 -left-20 w-96 h-96 bg-yellow-500/10 blur-[140px] rounded-full"></div>
        <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-pink-500/10 blur-[140px] rounded-full"></div>
    </div>

    <!-- Zaglavlje -->
    <header class="max-w-3xl mx-auto w-full glass-card rounded-2xl p-3 md:p-4 mb-4 flex justify-between items-center border border-white/10 shadow-xl">
        <div class="flex items-center gap-3">
            <span class="text-3xl" aria-hidden="true">🟡</span>
            <div>
                <h1 class="text-lg md:text-2xl font-black text-yellow-400 leading-tight">Pac-Man Edu</h1>
                <p class="text-[10px] md:text-xs text-slate-400 font-mono hidden sm:block">Skupi sve točkice i bježi od duhova!</p>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-4">
            <button onclick="window.location.href='../../index.html'" class="px-3 py-2 rounded-xl border border-white/15 text-xs font-bold text-slate-200 hover:bg-white/10 transition-all flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">home</span> <span class="hidden sm:inline">Hub</span>
            </button>
            <button onclick="showSettings()" class="px-3 py-2 rounded-xl border border-white/15 text-xs font-bold text-slate-200 hover:bg-white/10 transition-all flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">settings</span>
            </button>
        </div>
    </header>

    <!-- HUD -->
    <div class="max-w-3xl mx-auto w-full flex justify-between items-center px-2 mb-2 font-mono text-sm md:text-base font-bold text-yellow-400">
        <div>SCORE: <span id="scoreVal">0</span></div>
        <div class="text-white text-xs md:text-sm bg-white/10 px-2 py-1 rounded-md border border-white/10">LEVEL <span id="levelVal">1</span></div>
        <div class="flex gap-1" id="livesContainer">
            <span>💛</span><span>💛</span><span>💛</span>
        </div>
    </div>

    <!-- Game Area -->
    <main class="flex-1 flex flex-col justify-start items-center w-full relative h-full">
        <canvas id="gameCanvas" class="glass-card rounded-xl shadow-2xl border border-white/10 touch-none"></canvas>
        
        <!-- Virtual D-Pad -->
        <div id="dpad" class="hidden relative mt-2 mb-24 w-40 h-40 shrink-0">
            <button class="dpad-btn absolute top-0 left-1/2 -translate-x-1/2 w-12 h-12 rounded-xl bg-white/10 active:bg-yellow-500/50 flex justify-center items-center border border-white/5" data-dir="UP">
                <span class="material-symbols-outlined text-white">keyboard_arrow_up</span>
            </button>
            <button class="dpad-btn absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-12 rounded-xl bg-white/10 active:bg-yellow-500/50 flex justify-center items-center border border-white/5" data-dir="DOWN">
                <span class="material-symbols-outlined text-white">keyboard_arrow_down</span>
            </button>
            <button class="dpad-btn absolute left-0 top-1/2 -translate-y-1/2 w-12 h-12 rounded-xl bg-white/10 active:bg-yellow-500/50 flex justify-center items-center border border-white/5" data-dir="LEFT">
                <span class="material-symbols-outlined text-white">keyboard_arrow_left</span>
            </button>
            <button class="dpad-btn absolute right-0 top-1/2 -translate-y-1/2 w-12 h-12 rounded-xl bg-white/10 active:bg-yellow-500/50 flex justify-center items-center border border-white/5" data-dir="RIGHT">
                <span class="material-symbols-outlined text-white">keyboard_arrow_right</span>
            </button>
        </div>
    </main>

    <!-- Postavke Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-card p-6 md:p-8 rounded-3xl max-w-sm w-full border border-yellow-500/40 shadow-2xl">
            <h2 class="text-2xl font-black text-yellow-400 mb-6 text-center">Postavke Igre</h2>
            
            <div class="mb-5">
                <label class="block text-xs text-slate-400 font-bold mb-2 uppercase tracking-wider">Mod Igre</label>
                <div class="grid grid-cols-2 gap-2" id="mode-selector">
                    <button data-val="classic" class="setting-btn active px-3 py-2 rounded-lg border border-yellow-500/50 bg-yellow-500/20 text-yellow-400 text-sm font-bold transition-all">Klasični</button>
                    <button data-val="edu" class="setting-btn px-3 py-2 rounded-lg border border-white/10 bg-white/5 text-slate-300 text-sm font-bold hover:bg-white/10 transition-all">Edukativni</button>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-xs text-slate-400 font-bold mb-2 uppercase tracking-wider">Težina Igre</label>
                <div class="grid grid-cols-3 gap-2" id="difficulty-selector">
                    <button data-val="slow" class="setting-btn px-2 py-2 rounded-lg border border-white/10 bg-white/5 text-slate-300 text-xs font-bold hover:bg-white/10 transition-all">Sporo</button>
                    <button data-val="medium" class="setting-btn active px-2 py-2 rounded-lg border border-yellow-500/50 bg-yellow-500/20 text-yellow-400 text-xs font-bold transition-all">Srednje</button>
                    <button data-val="fast" class="setting-btn px-2 py-2 rounded-lg border border-white/10 bg-white/5 text-slate-300 text-xs font-bold hover:bg-white/10 transition-all">Brzo</button>
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-xs text-slate-400 font-bold mb-2 uppercase tracking-wider">Kontrole (Mobitel)</label>
                <div class="grid grid-cols-2 gap-2" id="control-selector">
                    <button data-val="swipe" class="setting-btn active px-3 py-2 rounded-lg border border-yellow-500/50 bg-yellow-500/20 text-yellow-400 text-sm font-bold transition-all">Swipe</button>
                    <button data-val="dpad" class="setting-btn px-3 py-2 rounded-lg border border-white/10 bg-white/5 text-slate-300 text-sm font-bold hover:bg-white/10 transition-all">Strelice</button>
                </div>
            </div>

            <button onclick="startGame()" class="w-full py-3 bg-yellow-500 text-slate-950 font-black rounded-xl hover:bg-yellow-400 transition-all shadow-lg active:scale-95">Započni Igru</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="glass-card p-8 rounded-3xl max-w-sm w-full text-center border border-red-500/40 shadow-2xl">
            <div class="text-6xl mb-3">👻</div>
            <h2 id="end-title" class="text-2xl font-black text-red-400 mb-2">Game Over</h2>
            <p class="text-sm text-slate-300 mb-6">Tvoj rezultat: <span id="finalScore" class="font-bold text-yellow-400 font-mono">0</span></p>
            <button onclick="showSettings()" class="w-full py-3 bg-yellow-500 text-slate-950 font-black rounded-xl hover:bg-yellow-400 transition-all shadow-lg active:scale-95">Igraj ponovno</button>
        </div>
    </div>

    <!-- Level Up Modal -->
    <div id="levelup-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center z-50 p-4 pointer-events-none transition-opacity duration-300">
        <div class="glass-card p-8 rounded-3xl max-w-sm w-full text-center border border-yellow-500/40 shadow-2xl animate-pulse">
            <div class="text-6xl mb-3">🚀</div>
            <h2 class="text-3xl font-black text-yellow-400 mb-2">Level Up!</h2>
            <p class="text-sm text-slate-300 font-mono">Učitavanje nove mape...</p>
        </div>
    </div>

    <!-- Edu Modal -->
    <div id="edu-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-lg hidden items-center justify-center z-50 p-4">
        <div class="glass-card p-6 md:p-8 rounded-3xl max-w-md w-full border border-cyan-500/40 shadow-2xl">
            <h2 class="text-xl font-black text-cyan-400 mb-4 flex items-center gap-2 justify-center">
                <span class="material-symbols-outlined">school</span> Pitanje spasa!
            </h2>
            <p id="edu-question" class="text-slate-200 mb-6 font-bold text-center">Priprema baze...</p>
            <div class="grid grid-cols-2 gap-3" id="edu-answers">
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../../sw.js');
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
