<!DOCTYPE html>
<html class="dark" lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pasijans - EduArcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #dce1fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            user-select: none;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Stilovi za karte */
        .card {
            width: 68px;
            height: 98px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            font-weight: bold;
            color: #222;
            border: 2px solid #cbd5e1;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .card.red { color: #ef4444; }
        .card.black { color: #0f172a; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 12px rgba(0,0,0,0.4); z-index: 50; }
        .card.selected { border: 3px solid #22c55e !important; box-shadow: 0 0 15px rgba(34, 197, 94, 0.6); z-index: 60; }
        .card-back {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0, rgba(255,255,255,0.05) 8px, transparent 0, transparent 16px);
            cursor: default;
        }
        .card-back:hover { transform: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        .pile-slot {
            width: 68px;
            height: 98px;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
        }

        @media (max-width: 600px) {
            .card, .pile-slot { width: 50px; height: 72px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 selection:bg-green-500/30">

    <!-- Zaglavlje -->
    <header class="max-w-5xl mx-auto w-full glass-card rounded-2xl p-4 mb-6 flex justify-between items-center border border-white/10 shadow-lg">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🎴</span>
            <h1 class="text-xl sm:text-2xl font-black text-green-400">Klondike Pasijans</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='../../index.html'" class="px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold text-slate-200 hover:bg-white/10 transition-all flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">home</span> Hub
            </button>
            <button onclick="startNewGame()" class="px-4 py-1.5 bg-green-500 hover:bg-green-400 text-slate-950 font-extrabold text-xs rounded-full transition-all shadow-md">
                Nova igra
            </button>
        </div>
    </header>

    <!-- Glavni dio igre -->
    <main class="max-w-5xl mx-auto w-full flex-1 flex flex-col gap-8">
        
        <!-- Gornji red: Špil, Otpad i Temelji -->
        <div class="flex justify-between items-center glass-card p-4 rounded-2xl">
            <!-- Špil i Otpad -->
            <div class="flex gap-4">
                <div id="stock-pile" onclick="drawStockCard()" class="pile-slot cursor-pointer flex items-center justify-center text-slate-500 text-xs font-bold">
                    🔄
                </div>
                <div id="waste-pile" class="pile-slot relative"></div>
            </div>

            <!-- Temeljne gomile (A do K po bojama) -->
            <div class="flex gap-2 sm:gap-4">
                <div class="pile-slot foundation" data-suit="♥"></div>
                <div class="pile-slot foundation" data-suit="♦"></div>
                <div class="pile-slot foundation" data-suit="♠"></div>
                <div class="pile-slot foundation" data-suit="♣"></div>
            </div>
        </div>

        <!-- Donji red: 7 kolona stola -->
        <div class="flex justify-between gap-1 sm:gap-4 flex-1 glass-card p-4 rounded-2xl min-h-[360px] overflow-x-auto" id="tableau-container">
            <div class="pile-slot tableau relative flex-1" data-column="0"></div>
            <div class="pile-slot tableau relative flex-1" data-column="1"></div>
            <div class="pile-slot tableau relative flex-1" data-column="2"></div>
            <div class="pile-slot tableau relative flex-1" data-column="3"></div>
            <div class="pile-slot tableau relative flex-1" data-column="4"></div>
            <div class="pile-slot tableau relative flex-1" data-column="5"></div>
            <div class="pile-slot tableau relative flex-1" data-column="6"></div>
        </div>
    </main>

    <!-- Modal za pobjedu -->
    <div id="win-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="glass-card p-8 rounded-3xl max-w-sm w-full text-center border border-green-500/30 shadow-2xl">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-2xl font-black text-green-400 mb-2">Čestitamo!</h2>
            <p class="text-sm text-slate-400 mb-6">Uspješno si složio cijeli pasijans i pobijedio u igri!</p>
            <button onclick="startNewGame()" class="w-full py-3 bg-green-500 text-slate-950 font-extrabold rounded-xl hover:bg-green-400 transition-all shadow-lg">Igraj ponovno</button>
        </div>
    </div>

    <!-- Podnožje -->
    <footer class="text-center py-4 text-xs text-slate-600 font-mono mt-8">
        EduArcade &bull; Pasijans
    </footer>

    <script>
        const SUITS = [
            { symbol: '♥', color: 'red' },
            { symbol: '♦', color: 'red' },
            { symbol: '♠', color: 'black' },
            { symbol: '♣', color: 'black' }
        ];
        const RANKS = [
            { name: 'A', val: 1 }, { name: '2', val: 2 }, { name: '3', val: 3 },
            { name: '4', val: 4 }, { name: '5', val: 5 }, { name: '6', val: 6 },
            { name: '7', val: 7 }, { name: '8', val: 8 }, { name: '9', val: 9 },
            { name: '10', val: 10 }, { name: 'J', val: 11 }, { name: 'Q', val: 12 }, { name: 'K', val: 13 }
        ];

        let deck = [];
        let stock = [];
        let waste = [];
        let foundations = { '♥': [], '♦': [], '♠': [], '♣': [] };
        let tableau = [[], [], [], [], [], [], []];
        let selection = null; // { type: 'waste'|'tableau', colIndex, cardIndex }

        function initDeck() {
            deck = [];
            let id = 0;
            SUITS.forEach(suit => {
                RANKS.forEach(rank => {
                    deck.push({ id: id++, suit: suit.symbol, color: suit.color, name: rank.name, val: rank.val, faceUp: false });
                });
            });
            // Promiješaj špil
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function startNewGame() {
            initDeck();
            stock = [];
            waste = [];
            foundations = { '♥': [], '♦': [], '♠': [], '♣': [] };
            tableau = [[], [], [], [], [], [], []];
            selection = null;
            document.getElementById('win-modal').classList.add('hidden');

            // Podjeli karte u 7 kolona
            for (let col = 0; col < 7; col++) {
                for (let row = col; row < 7; row++) {
                    let card = deck.pop();
                    if (row === col) card.faceUp = true;
                    tableau[row].push(card);
                }
            }
            // Ostatak u stock
            stock = deck;
            render();
        }

        function drawStockCard() {
            selection = null;
            if (stock.length === 0) {
                stock = waste.reverse();
                waste = [];
                stock.forEach(c => c.faceUp = false);
            } else {
                let card = stock.pop();
                card.faceUp = true;
                waste.push(card);
            }
            render();
        }

        function handleCardClick(type, colIdx, cardIdx) {
            let clickedCard = null;
            if (type === 'waste') {
                if (waste.length === 0) return;
                clickedCard = waste[waste.length - 1];
            } else if (type === 'tableau') {
                clickedCard = tableau[colIdx][cardIdx];
                if (!clickedCard.faceUp) {
                    // Ako je zadnja karta licem prema dolje, okreni je
                    if (cardIdx === tableau[colIdx].length - 1) {
                        clickedCard.faceUp = true;
                        render();
                    }
                    return;
                }
            }

            if (!selection) {
                if (type === 'waste' || type === 'tableau') {
                    selection = { type, colIdx, cardIdx };
                    render();
                }
            } else {
                // Pokušaj premještanja
                tryMove(selection, { type, colIdx, cardIdx });
            }
        }

        function tryMove(from, to) {
            let movingCards = [];
            if (from.type === 'waste') {
                movingCards = [waste[waste.length - 1]];
            } else if (from.type === 'tableau') {
                movingCards = tableau[from.colIdx].slice(from.cardIdx);
            }

            let targetCard = null;
            if (to.type === 'tableau') {
                let col = tableau[to.colIdx];
                if (col.length > 0) targetCard = col[col.length - 1];

                let canPlace = false;
                if (!targetCard) {
                    if (movingCards[0].name === 'K') canPlace = true; // Samo kralj na prazno
                } else {
                    if (targetCard.color !== movingCards[0].color && targetCard.val === movingCards[0].val + 1) {
                        canPlace = true;
                    }
                }

                if (canPlace) {
                    executeMove(from, to, movingCards);
                }
            }
            selection = null;
            render();
            checkWin();
        }

        function tryMoveToFoundation(suit) {
            if (!selection) return;
            let movingCard = null;
            if (selection.type === 'waste' && waste.length > 0) {
                movingCard = waste[waste.length - 1];
            } else if (selection.type === 'tableau') {
                let col = tableau[selection.colIdx];
                if (selection.cardIdx === col.length - 1) {
                    movingCard = col[col.length - 1];
                }
            }

            if (!movingCard || movingCard.suit !== suit) {
                selection = null;
                render();
                return;
            }

            let fPile = foundations[suit];
            let topCard = fPile.length > 0 ? fPile[fPile.length - 1] : null;

            let canMove = false;
            if (!topCard && movingCard.name === 'A') canMove = true;
            else if (topCard && movingCard.val === topCard.val + 1) canMove = true;

            if (canMove) {
                if (selection.type === 'waste') {
                    foundations[suit].push(waste.pop());
                } else if (selection.type === 'tableau') {
                    foundations[suit].push(tableau[selection.colIdx].pop());
                    let col = tableau[selection.colIdx];
                    if (col.length > 0) col[col.length - 1].faceUp = true;
                }
            }
            selection = null;
            render();
            checkWin();
        }

        function executeMove(from, to, movingCards) {
            if (from.type === 'waste') {
                waste.pop();
            } else if (from.type === 'tableau') {
                tableau[from.colIdx].splice(from.cardIdx, movingCards.length);
                let col = tableau[from.colIdx];
                if (col.length > 0) col[col.length - 1].faceUp = true;
            }
            tableau[to.colIdx].push(...movingCards);
        }

        function checkWin() {
            let totalFoundations = Object.values(foundations).reduce((acc, pile) => acc + pile.length, 0);
            if (totalFoundations === 52) {
                document.getElementById('win-modal').classList.remove('hidden');
            }
        }

        function renderCardHtml(card, isSelected) {
            let selectedClass = isSelected ? 'selected' : '';
            if (!card.faceUp) {
                return `<div class="card card-back absolute"></div>`;
            }
            return `<div class="card ${card.color} absolute ${selectedClass}">
                <div class="text-xs leading-none"><span>${card.name}</span><br><span>${card.suit}</span></div>
                <div class="text-center text-xl my-auto">${card.suit}</div>
                <div class="text-xs leading-none rotate-180 text-right"><span>${card.name}</span><br><span>${card.suit}</span></div>
            </div>`;
        }

        function render() {
            // Render Stock
            let stockEl = document.getElementById('stock-pile');
            stockEl.innerHTML = stock.length > 0 ? `<div class="card card-back absolute"></div>` : `<span class="text-xs">🔄</span>`;

            // Render Waste
            let wasteEl = document.getElementById('waste-pile');
            wasteEl.innerHTML = '';
            if (waste.length > 0) {
                let topWaste = waste[waste.length - 1];
                let isSelected = selection && selection.type === 'waste';
                let div = document.createElement('div');
                div.innerHTML = renderCardHtml(topWaste, isSelected);
                div.onclick = () => handleCardClick('waste');
                wasteEl.appendChild(div.firstElementChild);
            }

            // Render Foundations
            document.querySelectorAll('.foundation').forEach(slot => {
                let suit = slot.dataset.suit;
                slot.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-slate-600 text-lg">${suit}</div>`;
                slot.onclick = () => tryMoveToFoundation(suit);
                let pile = foundations[suit];
                if (pile.length > 0) {
                    let topCard = pile[pile.length - 1];
                    let div = document.createElement('div');
                    div.innerHTML = renderCardHtml(topCard, false);
                    slot.appendChild(div.firstElementChild);
                }
            });

            // Render Tableau
            let tableauContainers = document.querySelectorAll('.tableau');
            tableauContainers.forEach((slot, colIdx) => {
                slot.innerHTML = '';
                slot.onclick = (e) => {
                    // Ako se klikne prazan dio kolone, a imamo selekciju, provjeri jel možemo staviti kralja
                    if (selection && tableau[colIdx].length === 0) {
                        tryMove(selection, { type: 'tableau', colIdx });
                    }
                };

                let colCards = tableau[colIdx];
                colCards.forEach((card, cardIdx) => {
                    let isSelected = selection && selection.type === 'tableau' && selection.colIdx === colIdx && cardIdx >= selection.cardIdx;
                    let div = document.createElement('div');
                    div.innerHTML = renderCardHtml(card, isSelected);
                    let cardEl = div.firstElementChild;
                    cardEl.style.top = `${cardIdx * 24}px`;
                    cardEl.onclick = (e) => {
                        e.stopPropagation();
                        handleCardClick('tableau', colIdx, cardIdx);
                    };
                    slot.appendChild(cardEl);
                });
            });
        }

        window.onload = () => {
            startNewGame();
        };
    </script>
</body>
</html>
