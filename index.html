<!DOCTYPE html>
<html class="dark" lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>EduArcade Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body { 
            background-color: #020617; 
            color: #dce1fb; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden;
        }
        .glass-card { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .neon-title {
            text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col justify-between selection:bg-green-500/30">

    <!-- Dinamička pozadinska svjetla -->
    <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
        <div class="absolute top-1/4 -left-20 w-96 h-96 bg-green-500/10 blur-[140px] rounded-full"></div>
        <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-cyan-500/10 blur-[140px] rounded-full"></div>
    </div>

    <div>
        <!-- Zaglavlje Portala -->
        <header class="max-w-4xl mx-auto mb-10 text-center pt-4">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/10 border border-green-500/20 text-green-400 text-xs font-black tracking-widest uppercase mb-4">
                <span class="material-symbols-outlined text-sm">sports_esports</span> Edukativna Arkadna Platforma
            </div>
            <h1 class="text-4xl sm:text-6xl font-black text-green-400 mb-3 neon-title tracking-tight">EduArcade</h1>
            <p class="text-slate-400 text-sm sm:text-base max-w-lg mx-auto">Zabavi se, razgibaj reflekse i testiraj svoje znanje kroz kolekciju pametnih igara.</p>
        </header>

        <!-- Status / HUD bar -->
        <div class="max-w-4xl mx-auto mb-8 flex justify-between items-center glass-card rounded-xl p-4 border border-white/5 shadow-lg text-xs font-mono">
            <div class="flex items-center gap-2 text-slate-400">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Sustav aktivan
            </div>
            <div class="text-cyan-400 font-bold" id="games-counter">Dostupne igre: 0</div>
        </div>

        <!-- Mreža Igara (Grid) -->
        <div id="game-grid" class="max-w-4xl mx-auto grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Dinamički iscrtane kartice -->
        </div>
    </div>

    <!-- Podnožje -->
    <footer class="text-center py-8 text-xs text-slate-600 font-mono mt-12">
        EduArcade Portal &bull; Uči kroz igru
    </footer>

    <script>
        // Centralna lista igara (Sada uključuje i Pasijans)[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)
        const gamesList = [
            { 
                id: 'snake', 
                name: 'Snake Edu Pro', 
                desc: 'Vježbaj matematičke operacije, povijest i geografiju uz klasičnu zmiju s modernim 360° kontrolama.', 
                badge: 'Akcija & Kviz',
                color: 'green', 
                borderHover: 'hover:border-green-500/50 hover:shadow-[0_0_25px_rgba(34,197,94,0.2)]',
                icon: '🐍', 
                url: 'games/snake/index.html[span_4](start_span)'[span_4](end_span)
            },
            { 
                id: 'tablic', 
                name: 'Tablić', 
                desc: 'Klasična kartaška igra strategije i zbrajanja brojeva protiv pametnog računalnog suparnika.', 
                badge: 'Strategija & Brojevi',
                color: 'purple', 
                borderHover: 'hover:border-purple-500/50 hover:shadow-[0_0_25px_rgba(168,85,247,0.2)]',
                icon: '🃏', 
                url: 'games/tablic/index.html[span_5](start_span)'[span_5](end_span)
            },
            { 
                id: 'pasijans', 
                name: 'Klondike Pasijans', 
                desc: 'Klasična kartaška igra strpljenja i slaganja nizova od asa do kralja po znakovima.', 
                badge: 'Logika & Strpljenje',
                color: 'cyan', 
                borderHover: 'hover:border-cyan-500/50 hover:shadow-[0_0_25px_rgba(6,182,212,0.2)]',
                icon: '🎴', 
                url: 'games/pasijans/index.html[span_6](start_span)'[span_6](end_span)
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('game-grid');
            const counter = document.getElementById('games-counter');
            if (!grid) return;
            
            counter.innerText = `Dostupne igre: ${gamesList.length}`;
            grid.innerHTML = '';
            
            gamesList.forEach(game => {
                const card = document.createElement('div');
                card.className = `glass-card p-6 sm:p-8 rounded-2xl cursor-pointer hover:-translate-y-1 active:scale-98 transition-all duration-300 border border-white/10 ${game.borderHover} flex flex-col justify-between group`;
                card.onclick = () => window.location.href = game.url;
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-4xl sm:text-5xl p-3 bg-white/5 rounded-xl border border-white/5 group-hover:scale-110 transition-transform">${game.icon}</span>
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-black tracking-wider uppercase bg-white/5 border border-white/10 text-slate-300">${game.badge}</span>
                        </div>
                        <h2 class="text-xl sm:text-2xl font-black mb-2 text-white group-hover:text-green-400 transition-colors flex items-center justify-between">
                            ${game.name}
                            <span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-opacity text-green-400">arrow_forward</span>
                        </h2>
                        <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">${game.desc}</p>
                    </div>
                    <div class="mt-6 pt-4 border-t border-white/5 flex items-center text-xs font-bold text-green-400 gap-1">
                        Pokreni igru <span class="material-symbols-outlined text-sm">play_arrow</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
    </script>
</body> 
</html>
